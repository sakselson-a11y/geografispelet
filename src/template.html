<title>Blindkarta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Spline+Sans+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app — question bar on top, map fills the rest, overlays for start and result */
/* Layout: one-screen app — question bar on top, map fills the rest, overlays for start and result. Lekfull: bright sea, rounded type, chunky press-able buttons */
:root{
  --sea:#5dbbea; --sea-line:#4aa9da;
  --land:#fff4cf; --land-ctx:#dfe8d0; --border:#2f6f99;
  --ink:#17284a; --muted:#4b5f80; --panel:#ffffff; --panel-line:#cfe3f1;
  --ok:#2fbf5f; --ok-soft:#d3f3dd; --bad:#ff5b4a; --miss:#ff9f1c; --miss-soft:#ffe6c2;
  --accent:#ff7a2f; --accent-deep:#c95a1c; --on-accent:#ffffff;
  --f-ui:"Baloo 2",ui-rounded,system-ui,-apple-system,sans-serif;
  --f-num:"Spline Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f2f4d; --sea-line:#163a5c; --land:#2b4a68; --land-ctx:#1b3550; --border:#7cb3df;
  --ink:#eef6ff; --muted:#a9c1dc; --panel:#14304d; --panel-line:#25496d;
  --ok:#3fd47a; --ok-soft:#1d4a33; --bad:#ff6b5c; --miss:#ffb340; --miss-soft:#4d3a14; --accent:#ff8a3d; --accent-deep:#b4521a; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f2f4d; --sea-line:#163a5c; --land:#2b4a68; --land-ctx:#1b3550; --border:#7cb3df;
  --ink:#eef6ff; --muted:#a9c1dc; --panel:#14304d; --panel-line:#25496d;
  --ok:#3fd47a; --ok-soft:#1d4a33; --bad:#ff6b5c; --miss:#ffb340; --miss-soft:#4d3a14; --accent:#ff8a3d; --accent-deep:#b4521a; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column}
.bar{background:var(--panel);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 8%,transparent);
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;min-height:64px;z-index:2}
.q{flex:1;min-width:0}
.q small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q strong{display:block;font-size:clamp(24px,7vw,32px);line-height:1.1;font-weight:800;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{font-family:var(--f-num);font-size:14px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog b{color:var(--ok);font-weight:500}
.iconbtn{appearance:none;border:1px solid var(--panel-line);background:transparent;color:var(--ink);border-radius:10px;
  width:40px;height:40px;font:600 13px var(--f-ui);cursor:pointer;display:grid;place-items:center;flex:none}
.mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#sea{fill:var(--sea)}
.grat{fill:none;stroke:var(--sea-line);stroke-width:1}
.ctx{fill:var(--land-ctx);stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke}
.c{fill:var(--land);stroke:var(--border);stroke-width:1.1;vector-effect:non-scaling-stroke;transition:fill .25s}
.c.ok{fill:var(--ok)}
.c.bad{fill:var(--bad);transition:none}
.c.miss{fill:var(--miss)}
.c.sel{fill:var(--accent)}
.dot{fill:var(--land);stroke:var(--border);vector-effect:non-scaling-stroke;stroke-width:1}
.dot.ok{fill:var(--ok);stroke:var(--ok)} .dot.bad{fill:var(--bad);stroke:var(--bad)} .dot.miss{fill:var(--miss);stroke:var(--ink)}
.hit{fill:transparent}
.lbl{font-family:var(--f-ui);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.lbl.miss{fill:var(--ink)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.zoom button{appearance:none;width:46px;height:46px;border-radius:16px;border:2px solid var(--panel-line);background:var(--panel);
  color:var(--ink);font:700 24px var(--f-ui);cursor:pointer;box-shadow:0 3px 0 var(--panel-line)}
.zoom button:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-6px);opacity:0;pointer-events:none;
  background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:6px 20px;font-weight:800;font-size:19px;
  box-shadow:0 4px 14px rgba(0,0,0,.15);transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));
  font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:6px 10px;border-radius:8px;max-width:60%}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--sea) 55%,transparent);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:2px solid var(--panel-line);border-radius:28px;width:min(420px,100%);
  max-height:100%;overflow:auto;padding:24px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.card h1{margin:0;font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.card h1 span{color:var(--accent)}
.card p{margin:0;color:var(--muted);line-height:1.45}
.lab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{appearance:none;border:2px solid var(--panel-line);background:var(--panel);color:var(--ink);border-radius:18px;
  padding:11px 0 9px;font:700 18px var(--f-ui);cursor:pointer;box-shadow:0 3px 0 var(--panel-line);transition:transform .08s,box-shadow .08s}
.chip:active,.ans:active:not(:disabled),.zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--panel-line)}
.conts{grid-template-columns:repeat(2,1fr)}
.conts .chip{font-size:16px;padding:11px 0}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-deep)}
.btn{appearance:none;border:0;border-radius:18px;padding:14px 18px 12px;font:800 20px var(--f-ui);cursor:pointer;
  background:var(--accent);color:var(--on-accent);width:100%;box-shadow:0 5px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.sec{background:var(--panel);color:var(--ink);border:2px solid var(--panel-line);box-shadow:0 4px 0 var(--panel-line)}
.btn.sec:active{box-shadow:0 1px 0 var(--panel-line)}
.row{display:flex;gap:10px}
.score{font-family:var(--f-num);font-size:54px;line-height:1;letter-spacing:-.03em}
.score small{font-size:22px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.list li{display:flex;gap:6px;align-items:baseline;min-width:0}
.list li i{font-style:normal;font-weight:700;width:14px;flex:none}
.list li.y i{color:var(--ok)} .list li.n i{color:var(--miss)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--sw)}
.answers{background:var(--panel);border-top:2px solid var(--panel-line);display:grid;grid-template-columns:1fr 1fr;gap:8px;
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ans{appearance:none;border:2px solid var(--panel-line);background:var(--panel);color:var(--ink);border-radius:18px;
  min-height:54px;padding:8px 10px 6px;font:700 18px/1.15 var(--f-ui);cursor:pointer;text-wrap:balance;box-shadow:0 3px 0 var(--panel-line);transition:transform .08s,box-shadow .08s}
.ans.ok{background:var(--ok);border-color:var(--ok);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.ans.bad{background:var(--bad);border-color:var(--bad);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.ans:disabled{cursor:default}
.ans:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modes{grid-template-columns:repeat(2,1fr)}
.flagbox{background:var(--panel);border-bottom:2px solid var(--panel-line);display:flex;justify-content:center;align-items:center;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.flagbox img{height:clamp(96px,22vh,170px);aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:10px;
  box-shadow:0 0 0 1px var(--panel-line),0 6px 18px rgba(0,0,0,.14);background:var(--land-ctx)}
.list .fl{width:22px;height:16.5px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px var(--panel-line);flex:none;align-self:center}
.modes .chip{font-size:15px;padding:11px 4px}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:500;line-height:1.3}
.toggle input{appearance:none;-webkit-appearance:none;margin:0;flex:none;width:46px;height:28px;border-radius:999px;background:var(--panel-line);position:relative;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(18px)}
.toggle input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl .cap{font-weight:500;fill:var(--muted)}
.dot.city{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.dot.city.ok{fill:var(--ok);stroke:var(--ink)} .dot.city.bad{fill:var(--bad);stroke:var(--ink)} .dot.city.miss{fill:var(--miss);stroke:var(--ink)} .dot.city.sel{fill:var(--accent);stroke:var(--ink)}
.conts .chip{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.1}
.cst{font-size:13px;letter-spacing:1px;color:var(--miss);min-height:14px}
.chip[aria-pressed="true"] .cst{color:var(--on-accent)}
.conts .chip.se{grid-column:1/-1}
.rec{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--muted);margin-top:-6px;text-align:center}
.rec b{color:var(--miss);letter-spacing:2px;font-size:18px}
.bigstars{font-size:40px;letter-spacing:4px;color:var(--miss);line-height:1;margin-top:6px}
.bigstars .off{color:var(--panel-line)}
.newrec{display:inline-block;background:var(--miss);color:var(--on-accent);font-weight:800;border-radius:999px;padding:3px 12px 1px;margin-left:8px;font-size:15px;vertical-align:middle;
  animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.toggles{display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion: reduce){.c,.toast{transition:none}.newrec{animation:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="q" id="q"><small id="qlab">Blindkarta</small><strong id="qname">Europa</strong></div>
    <div class="prog" id="prog"></div>
    <button class="iconbtn" id="menu" aria-label="Avsluta och välj nytt spel">✕</button>
  </header>
  <div class="flagbox" id="flagbox" hidden><img id="flagimg" alt="Flagga"></div>
  <div class="mapwrap" id="wrap">
    <svg id="map" viewBox="0 0 1000 860" preserveAspectRatio="xMidYMid meet" aria-label="Blindkarta">
      <rect id="sea" x="-5000" y="-5000" width="11000" height="11000"/>
      <g id="vp"><g id="gctx"></g><g id="gc"></g><g id="gdots"></g><g id="gcity"></g><g id="glbl"></g></g>
    </svg>
    <div class="toast" id="toast"></div>
    <div class="hint" id="hint">Nyp eller använd + / − för att zooma</div>
    <div class="zoom"><button id="zin" aria-label="Zooma in">+</button><button id="zout" aria-label="Zooma ut">−</button><button id="zfit" aria-label="Visa hela kartan" style="font-size:15px">⤢</button></div>
  </div>
  <div class="answers" id="answers" hidden>
    <button class="ans" id="a0"></button><button class="ans" id="a1"></button>
    <button class="ans" id="a2"></button><button class="ans" id="a3"></button>
  </div>
</div>

<div class="ov" id="start">
  <div class="card">
    <div>
      <div class="lab">Blindkarta</div>
      <h1><span id="h1mode">Hitta landet i</span> <span id="h1cont">Europa</span></h1>
    </div>
    <p id="howto"></p>
    <div>
      <div class="lab">Spelläge</div>
      <div class="chips modes" id="modes"></div>
    </div>
    <div>
      <div class="lab">Världsdel</div>
      <div class="chips conts" id="conts"></div>
    </div>
    <div>
      <div class="lab">Antal</div>
      <div class="chips" id="chips">
        <button class="chip" data-n="5" aria-pressed="false">5</button>
        <button class="chip" data-n="10" aria-pressed="true">10</button>
        <button class="chip" data-n="15" aria-pressed="false">15</button>
        <button class="chip" data-n="0" aria-pressed="false">Alla</button>
      </div>
    </div>
    <div class="toggles">
      <label class="toggle" for="showfix"><input type="checkbox" id="showfix"><span>Visa rätt svar direkt när jag svarar fel</span></label>
      <label class="toggle" for="sound"><input type="checkbox" id="sound"><span>Ljud</span></label>
    </div>
    <div class="rec" id="rec"></div>
    <button class="btn" id="go">Starta</button>
    <p id="gonote" style="text-align:center;font-size:13px;margin-top:-8px"></p>
  </div>
</div>

<div class="ov" id="end" hidden>
  <div class="card">
    <div>
      <div class="lab">Resultat</div>
      <div class="score" id="score"></div>
      <div class="bigstars" id="bigstars"></div>
      <p id="verdict" style="margin-top:8px"></p>
    </div>
    <ul class="list" id="list"></ul>
    <div class="row" id="endrow" style="flex-direction:column">
      <button class="btn" id="facit">Visa facit</button>
      <button class="btn sec" id="practice">Öva på de missade</button>
    </div>
    <button class="btn sec" id="again">Spela igen</button>
  </div>
</div>

<script>
const WORLD = __DATA__;
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const svg=$("map"), vp=$("vp");
let byKey={}, DATA;
let CONT="europa"; try{const v=localStorage.getItem("bk-cont"); if(v&&WORLD.maps[v]) CONT=v;}catch(e){}
function buildMap(key){
  const m=WORLD.maps[key]; DATA={W:m.W||WORLD.W,H:m.H||WORLD.H,countries:m.countries,cities:m.cities||[],context:m.context,name:m.name,se:!!m.se}; byKey={};
  svg.setAttribute("viewBox",`0 0 ${DATA.W} ${DATA.H}`);
  ["gctx","gc","gdots","gcity","glbl"].forEach(id=>$(id).innerHTML="");
  const p=document.createElementNS(NS,"path"); p.setAttribute("d",DATA.context); p.setAttribute("class","ctx"); p.dataset.k="__ctx"; $("gctx").appendChild(p);
  for(const c of DATA.countries){
    const el=document.createElementNS(NS,"path"); el.setAttribute("d",c.d); el.setAttribute("class","c"); el.dataset.k=c.k;
    $("gc").appendChild(el); c.el=el; byKey[c.k]=c;
    if(c.m){
      const dot=document.createElementNS(NS,"circle"); dot.setAttribute("cx",c.c[0]); dot.setAttribute("cy",c.c[1]); dot.setAttribute("class","dot");
      const hit=document.createElementNS(NS,"circle"); hit.setAttribute("cx",c.c[0]); hit.setAttribute("cy",c.c[1]); hit.setAttribute("class","hit"); hit.dataset.k=c.k;
      $("gdots").append(dot,hit); c.dot=dot; c.hit=hit;
    }
  }
  for(const c of DATA.cities){
    const dot=document.createElementNS(NS,"circle"); dot.setAttribute("cx",c.c[0]); dot.setAttribute("cy",c.c[1]); dot.setAttribute("class","dot city");
    const hit=document.createElementNS(NS,"circle"); hit.setAttribute("cx",c.c[0]); hit.setAttribute("cy",c.c[1]); hit.setAttribute("class","hit"); hit.dataset.k=c.k;
    $("gcity").append(dot,hit); c.el=dot; c.hit=hit; byKey[c.k]=c;
  }
  if(typeof renderModes==="function") renderModes();
  $("h1cont").textContent=m.name; $("qlab").textContent="Blindkarta"; $("qname").textContent=m.name; $("prog").innerHTML="";
  S=1;TX=0;TY=0; if(typeof apply==="function") apply(); updateNote();
}
// ---------- pan & zoom ----------
let S=1,TX=0,TY=0; const SMIN=1,SMAX=20;
function unitsPerPx(){const r=svg.getBoundingClientRect();return Math.max(DATA.W/r.width,DATA.H/r.height);}
function toUser(cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function clamp(){const W=DATA.W,H=DATA.H,m=0.25;
  TX=Math.min(W*(1-m)*1, Math.max(TX, W*m - W*S)); TY=Math.min(H*(1-m), Math.max(TY, H*m - H*S));}
function apply(){clamp();vp.setAttribute("transform",`translate(${TX} ${TY}) scale(${S})`);sizeMarks();}
function zoomAt(ux,uy,f){const ns=Math.min(SMAX,Math.max(SMIN,S*f));f=ns/S;TX=ux-(ux-TX)*f;TY=uy-(uy-TY)*f;S=ns;apply();}
function sizeMarks(){
  const u=unitsPerPx()/S;
  for(const c of DATA.countries){ if(c.m){c.dot.setAttribute("r",4*u);c.hit.setAttribute("r",(S>5?9:13)*u);} }
  for(const c of DATA.cities){ c.el.setAttribute("r",5.5*u); c.hit.setAttribute("r",(S>4?10:14)*u); }
  document.querySelectorAll(".lbl").forEach(t=>{t.setAttribute("font-size",13*u);t.setAttribute("stroke-width",3*u);});
}
let animId=0;
function animateTo(s,tx,ty){
  const s0=S,x0=TX,y0=TY,t0=performance.now(),d=matchMedia("(prefers-reduced-motion: reduce)").matches?0:420,id=++animId;
  (function step(t){if(id!==animId)return;const k=d?Math.min(1,(t-t0)/d):1,e=1-Math.pow(1-k,3);
    S=s0+(s-s0)*e;TX=x0+(tx-x0)*e;TY=y0+(ty-y0)*e;apply();if(k<1)requestAnimationFrame(step);})(t0);
}
function fitBox(b,pad=40){
  const r=svg.getBoundingClientRect(),u=unitsPerPx(),vw=r.width*u,vh=r.height*u;
  // visible area in user units is centered on viewBox
  const ox=(DATA.W-vw)/2,oy=(DATA.H-vh)/2;
  const s=Math.min(SMAX,Math.max(SMIN,Math.min((vw-2*pad*u)/b.width,(vh-2*pad*u)/b.height)));
  animTo2(s, ox+vw/2-(b.x+b.width/2)*s, oy+vh/2-(b.y+b.height/2)*s);
}
function animTo2(s,tx,ty){animateTo(s,tx,ty);}
$("zin").onclick=()=>{animId++;zoomAt(DATA.W/2,DATA.H/2,1.6);};
$("zout").onclick=()=>{animId++;zoomAt(DATA.W/2,DATA.H/2,1/1.6);};
$("zfit").onclick=()=>animateTo(1,0,0);

const wrap=$("wrap"); const ptrs=new Map(); let gesture=null, moved=false, downAt=null;
wrap.addEventListener("pointerdown",e=>{
  if(e.target.closest(".zoom"))return;
  animId++; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downAt={x:e.clientX,y:e.clientY};}
  else moved=true;
  gesture=null;
});
wrap.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId); const cur={x:e.clientX,y:e.clientY};
  if(ptrs.size===1){
    if(!moved && Math.hypot(cur.x-downAt.x,cur.y-downAt.y)>7) moved=true;
    if(moved){const a=toUser(prev.x,prev.y),b=toUser(cur.x,cur.y);TX+=b.x-a.x;TY+=b.y-a.y;apply();}
    ptrs.set(e.pointerId,cur);
  } else if(ptrs.size===2){
    const [ida,idb]=[...ptrs.keys()]; const other=ptrs.get(ida===e.pointerId?idb:ida);
    const d0=Math.hypot(prev.x-other.x,prev.y-other.y), d1=Math.hypot(cur.x-other.x,cur.y-other.y);
    const m0=toUser((prev.x+other.x)/2,(prev.y+other.y)/2), m1=toUser((cur.x+other.x)/2,(cur.y+other.y)/2);
    TX+=m1.x-m0.x;TY+=m1.y-m0.y; if(d0>0) zoomAt(m1.x,m1.y,d1/d0); else apply();
    ptrs.set(e.pointerId,cur);
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  const single=ptrs.size===1; ptrs.delete(e.pointerId);
  if(single && !moved && e.type==="pointerup"){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const k=el&&el.dataset?el.dataset.k:null; onTap(k);
  }
}
wrap.addEventListener("pointerup",endPtr); wrap.addEventListener("pointercancel",endPtr);
wrap.addEventListener("wheel",e=>{e.preventDefault();animId++;const u=toUser(e.clientX,e.clientY);zoomAt(u.x,u.y,Math.exp(-e.deltaY*0.0022));},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
addEventListener("resize",()=>apply());

// ---------- game ----------
let N=10, queue=[], idx=0, results=[], mode="idle", busy=false, MODE="land", SHOWFIX=false, SOUND=true, PRACTICE=false;
try{const m=localStorage.getItem("bk-mode"); if(m) MODE=m; SHOWFIX=localStorage.getItem("bk-fix")==="1"; SOUND=localStorage.getItem("bk-sound")!=="0";}catch(e){}
const MODES_WORLD={
  land:{label:"Länder",h:"Hitta landet i",how:"Ett land visas överst. Tryck på var det ligger. Rätt svar blir grönt och ligger kvar. Svarar du fel går du vidare till nästa land.",what:"länder"},
  cap:{label:"Huvud&shy;städer",h:"Huvudstäder i",how:"En huvudstad visas överst, till exempel Berlin. Tryck på landet där den ligger. Rätt svar blir grönt och ligger kvar.",what:"huvudstäder"},
  name:{label:"Välj namn",h:"Namnge länderna i",how:"Ett land lyses upp på kartan. Välj rätt namn bland fyra alternativ. Rätt svar blir grönt och ligger kvar.",what:"länder",q:"Vilket land?"},
  flag:{label:"Flaggor",h:"Flaggor i",how:"En flagga visas. Välj vilket land den tillhör bland fyra alternativ. Rätt svar blir grönt på kartan.",what:"flaggor",q:"Vilket land?"}
};
const MODES_SE={
  land:{label:"Landskap",h:"Hitta landskapen i",how:"Ett landskap visas överst. Tryck på var det ligger. Rätt svar blir grönt och ligger kvar.",what:"landskap"},
  name:{label:"Välj landskap",h:"Namnge landskapen i",how:"Ett landskap lyses upp på kartan. Välj rätt namn bland fyra alternativ.",what:"landskap",q:"Vilket landskap?"},
  city:{label:"Städer",h:"Hitta städerna i",how:"En stad visas överst. Tryck på rätt prick på kartan. Rätt svar blir grönt och ligger kvar.",what:"städer"},
  cityname:{label:"Välj stad",h:"Namnge städerna i",how:"En stad lyses upp på kartan. Välj rätt namn bland fyra alternativ.",what:"städer",q:"Vilken stad?"}
};
const MODES=()=>DATA&&DATA.se?MODES_SE:MODES_WORLD;
const CHOICE=()=>MODE==="name"||MODE==="flag"||MODE==="cityname";
const CITYMODE=()=>MODE==="city"||MODE==="cityname";
const flagSrc=c=>"flags/"+c.f+".svg";
function pool(){ return CITYMODE()?DATA.cities : MODE==="cap" ? DATA.countries.filter(c=>c.h) : DATA.countries; }
function allItems(){ return DATA.countries.concat(DATA.cities); }
function save(k,v){try{localStorage.setItem(k,v);}catch(e){}}
// records: best score per world part + mode + count
function recKey(){return CONT+"|"+MODE+"|"+(N||"alla");}
function recAll(){try{return JSON.parse(localStorage.getItem("bk-rec")||"{}");}catch(e){return {};}}
function getRec(k){return recAll()[k]||null;}
function setRec(k,v){const all=recAll(); all[k]=v; save("bk-rec",JSON.stringify(all));}
function stars(ok,n){const p=ok/n; return p===1?3:p>=.8?2:p>=.5?1:0;}
const starStr=s=>"★".repeat(s)+"☆".repeat(3-s);
function renderModes(){
  const M=MODES(); if(!M[MODE]) MODE="land";
  $("modes").innerHTML=Object.entries(M).map(([k,v])=>`<button class="chip" data-m="${k}" aria-pressed="${k===MODE}">${v.label}</button>`).join("");
  $("modes").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{MODE=b.dataset.m; save("bk-mode",MODE);
    $("modes").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false")); updateNote();});
}
function syncLayers(){ $("gcity").style.display=CITYMODE()?"":"none"; $("gdots").style.display=CITYMODE()?"none":""; }
document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#chips .chip").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); N=+b.dataset.n; updateNote();
});
$("showfix").checked=SHOWFIX;
$("showfix").onchange=e=>{SHOWFIX=e.target.checked; save("bk-fix",SHOWFIX?"1":"0");};
$("sound").checked=SOUND;
$("sound").onchange=e=>{SOUND=e.target.checked; save("bk-sound",SOUND?"1":"0"); if(SOUND){unlockAudio();sfx("ok");}};
function updateNote(){ if(!DATA)return; const M=MODES()[MODE]; const tot=pool().length;
  $("gonote").textContent=(N&&N<tot?N+" av ":"Alla ")+tot+" "+M.what+" i "+DATA.name;
  $("h1mode").textContent=M.h; $("howto").textContent=M.how;
  const r=getRec(recKey());
  $("rec").innerHTML=r?`Rekord: ${r.ok} av ${r.n} <b>${starStr(stars(r.ok,r.n))}</b>`:"Inget rekord än. Spela för att få stjärnor!";
  refreshStars(); syncLayers(); }
const conts=$("conts");
function refreshStars(){ conts.querySelectorAll(".chip").forEach(b=>{const k=b.dataset.c;
  const key=k+"|"+MODE+"|"+(N||"alla"); const r=getRec(key);
  b.querySelector(".cst").textContent=r?starStr(stars(r.ok,r.n)):""; }); }
for(const [k,m] of Object.entries(WORLD.maps)){const b=document.createElement("button");b.className="chip"+(m.se?" se":"");b.dataset.c=k;
  b.innerHTML=`<span>${m.name}</span><span class="cst"></span>`;
  b.setAttribute("aria-pressed",k===CONT?"true":"false");
  b.onclick=()=>{CONT=k;save("bk-cont",k);
    conts.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));buildMap(k);};
  conts.appendChild(b);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setClass(c,cls){
  if(c.city){ c.el.setAttribute("class","dot city"+(cls?" "+cls:"")); return; }
  c.el.setAttribute("class","c"+(cls?" "+cls:"")); if(c.dot)c.dot.setAttribute("class","dot"+(cls?" "+cls:""));}
function clearLabels(){$("glbl").innerHTML="";}
function addLabel(c){const t=document.createElementNS(NS,"text");t.setAttribute("x",c.c[0]);t.setAttribute("y",c.c[1]-(c.m?12*unitsPerPx()/S:0));
  t.setAttribute("dy","0.35em");t.setAttribute("class","lbl");
  if(MODE==="cap"&&c.h){const a=document.createElementNS(NS,"tspan");a.textContent=c.n;const b=document.createElementNS(NS,"tspan");
    b.textContent=c.h;b.setAttribute("class","cap");b.setAttribute("x",c.c[0]);b.setAttribute("dy","1.15em");t.append(a,b);}
  else t.textContent=c.n;
  $("glbl").appendChild(t);}
function bboxOf(c){ if(c.m) return {x:c.c[0]-2,y:c.c[1]-2,width:4,height:4}; return c.el.getBBox(); }
function zoomToCountry(c){const b=bboxOf(c),k=DATA.W/1000,w=Math.max(b.width*3,480*k),h=Math.max(b.height*3,420*k);
  fitBox({x:b.x+b.width/2-w/2,y:b.y+b.height/2-h/2,width:w,height:h},30);}
function start(list){ unlockAudio(); buildMap(CONT);
  PRACTICE=!!list;
  const src=list?list.map(c=>byKey[c.k]):pool(); const all=shuffle(src.slice());
  queue=(!list&&N)?all.slice(0,N):all; idx=0; results=[];
  allItems().forEach(c=>setClass(c,"")); clearLabels(); syncLayers();
  $("start").hidden=true; $("end").hidden=true; mode="play"; $("answers").hidden=!CHOICE(); $("flagbox").hidden=MODE!=="flag";
  animateTo(1,0,0); show();
}
function show(){
  const c=queue[idx], M=MODES()[MODE];
  if(MODE==="flag"){ $("qlab").textContent="Flaggor"; $("qname").textContent=M.q; $("flagimg").src=flagSrc(c);
    const nx=queue[idx+1]; if(nx){const im=new Image(); im.src=flagSrc(nx);} }
  else if(CHOICE()){ $("qlab").textContent="Välj namn"; $("qname").textContent=M.q; }
  else { $("qlab").textContent="Var ligger"; $("qname").textContent=MODE==="cap"?c.h:c.n; }
  const ok=results.filter(r=>r.ok).length;
  $("prog").innerHTML=`${idx+1} / ${queue.length}<br><b>${ok} rätt</b>`;
  if(MODE==="name"||MODE==="cityname"){ setClass(c,"sel"); zoomToCountry(c); }
  if(CHOICE()) renderOptions(c);
}
function renderOptions(c){
  const others=pool().filter(x=>x!==c);
  const d=x=>Math.hypot(x.c[0]-c.c[0],x.c[1]-c.c[1]);
  const near=others.slice().sort((a,b)=>d(a)-d(b)).slice(0,6);
  const pick=shuffle(near.slice()).slice(0,2);
  const rest=shuffle(others.filter(x=>!pick.includes(x)));
  while(pick.length<3&&rest.length) pick.push(rest.pop());
  const opts=shuffle([c,...pick]);
  for(let i=0;i<4;i++){const b=$("a"+i); const o=opts[i];
    b.hidden=!o; if(!o) continue; b.textContent=o.n; b.className="ans"; b.disabled=false; b.onclick=()=>answer(o,b);}
}
function answer(o,btn){
  if(mode!=="play"||busy)return; busy=true; const target=queue[idx];
  for(let i=0;i<4;i++) $("a"+i).disabled=true;
  if(o===target){ btn.classList.add("ok"); setClass(target,"ok"); results.push({c:target,ok:true}); toast("Rätt!","ok"); sfx("ok"); setTimeout(next,700); }
  else { btn.classList.add("bad"); results.push({c:target,ok:false}); sfx("bad");
    if(SHOWFIX){ for(let i=0;i<4;i++){const b=$("a"+i); if(b.textContent===target.n) b.classList.add("ok");} toast("Fel – det är "+target.n,"bad");
      if(MODE==="flag") setClass(target,"miss"); }
    else toast("Fel","bad");
    setTimeout(()=>{ setClass(target,""); next(); }, SHOWFIX?1600:750); }
}
let toastT;
function toast(msg,cls,ms){const t=$("toast");t.textContent=msg;t.className="toast show "+cls;clearTimeout(toastT);toastT=setTimeout(()=>t.className="toast",ms||1100);}
function onTap(k){
  if(mode==="facit"){ if(k&&byKey[k]) toast(byKey[k].n+(MODE==="cap"&&byKey[k].h?" · "+byKey[k].h:""),""); return; }
  if(mode!=="play"||busy||!k||CHOICE())return;
  if(CITYMODE() && !(byKey[k]&&byKey[k].city)) return;   // städer: bara prickarna räknas
  const target=queue[idx];
  if(k!=="__ctx" && byKey[k] && results.some(r=>r.ok&&r.c===byKey[k])){toast("Redan placerat","");return;}
  busy=true;
  if(k===target.k){
    setClass(target,"ok"); results.push({c:target,ok:true}); toast("Rätt!","ok"); sfx("ok"); if(navigator.vibrate)navigator.vibrate(15);
    setTimeout(next,550);
  } else {
    const w=byKey[k]; if(w) setClass(w,"bad");
    results.push({c:target,ok:false}); sfx("bad");
    if(SHOWFIX){ setClass(target,"miss"); toast(MODE==="cap"?`Fel – ${target.h} ligger i ${target.n}`:`Fel – här ligger ${target.n}`,"bad",1700); }
    else toast("Fel","bad");
    setTimeout(()=>{ if(w) setClass(w,""); setClass(target,""); next(); }, SHOWFIX?1800:650);
  }
}
function next(){busy=false; idx++; if(idx>=queue.length) finish(); else show();}
function finish(){
  mode="done"; $("answers").hidden=true; $("flagbox").hidden=true; const ok=results.filter(r=>r.ok).length, n=results.length, missed=n-ok;
  const st=stars(ok,n); let isNew=false;
  if(!PRACTICE){ const k=recKey(), r=getRec(k); if(!r||ok>r.ok){ setRec(k,{ok,n}); isNew=!!r||ok>0; } }
  $("score").innerHTML=`${ok}<small> / ${n} rätt</small>`+(isNew&&!PRACTICE?`<span class="newrec">Nytt rekord!</span>`:"");
  $("bigstars").innerHTML=PRACTICE?"":`${"★".repeat(st)}<span class="off">${"★".repeat(3-st)}</span>`;
  $("bigstars").hidden=PRACTICE;
  const pct=ok/n;
  $("verdict").textContent=(PRACTICE?"Övningsrunda. ":"")+(pct===1?"Alla rätt. Snyggt!": pct>=.8?"Bra jobbat!": pct>=.5?"Helt okej. Kolla facit och öva på de missade.":"Kolla facit och öva på de missade, så sitter det bättre nästa gång.");
  $("list").innerHTML=results.map(r=>`<li class="${r.ok?"y":"n"}"><i>${r.ok?"✓":"✗"}</i>${MODE==="flag"?`<img class="fl" src="${flagSrc(r.c)}" alt="">`:""}<span>${MODE==="cap"?r.c.h+" – "+r.c.n:r.c.n}</span></li>`).join("");
  $("endrow").hidden = missed===0;
  $("practice").textContent = missed===1?"Öva på den missade":`Öva på de ${missed} missade`;
  $("qlab").textContent="Klart"; $("qname").textContent=`${ok} av ${n} rätt`; $("prog").innerHTML="";
  $("end").hidden=false;
  if(pct===1){ sfx("win"); confetti(); } else sfx("done");
  updateNote();
}
function showFacit(){
  mode="facit"; $("end").hidden=true; clearLabels();
  const missed=results.filter(r=>!r.ok).map(r=>r.c);
  missed.forEach(c=>{setClass(c,"miss");addLabel(c);});
  results.filter(r=>r.ok).forEach(r=>addLabel(r.c));
  sizeMarks();
  $("qlab").textContent="Facit"; $("qname").textContent= missed.length===1?"1 att lära":`${missed.length} att lära`;
  $("prog").innerHTML=`<span style="color:var(--miss)">■</span> missade<br><b>■</b> rätt`;
  let b=null; missed.forEach(c=>{const bb=bboxOf(c);
    b=b?{x:Math.min(b.x,bb.x),y:Math.min(b.y,bb.y),x2:Math.max(b.x2,bb.x+bb.width),y2:Math.max(b.y2,bb.y+bb.height)}:{x:bb.x,y:bb.y,x2:bb.x+bb.width,y2:bb.y+bb.height};});
  if(b){const k=DATA.W/1000,w=Math.max(b.x2-b.x,160*k),h=Math.max(b.y2-b.y,160*k);fitBox({x:(b.x+b.x2)/2-w/2,y:(b.y+b.y2)/2-h/2,width:w,height:h},50);}
}
// ---------- ljud ----------
let AC=null;
function unlockAudio(){ if(!SOUND)return; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} }
function tone(f,t0,dur,type,vol){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,AC.currentTime+t0);
  g.gain.setValueAtTime(0.0001,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+dur); o.connect(g).connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+0.05); }
function sfx(kind){ if(!SOUND||!AC)return; try{
  if(kind==="ok"){ tone(784,0,.14,"triangle",.25); tone(1175,.09,.22,"triangle",.22); }
  else if(kind==="bad"){ tone(220,0,.18,"sine",.25); tone(165,.12,.25,"sine",.22); }
  else if(kind==="done"){ tone(523,0,.18,"triangle",.2); tone(784,.15,.3,"triangle",.2); }
  else if(kind==="win"){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25,"triangle",.24)); tone(1319,.5,.6,"triangle",.22); tone(1047,.5,.6,"sine",.15); }
}catch(e){} }
// ---------- konfetti ----------
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("confetti"); cv.hidden=false; const dpr=Math.min(2,devicePixelRatio||1);
  const W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr; const g=cv.getContext("2d");
  const cols=["#ff7a2f","#2fbf5f","#5dbbea","#ffd23f","#ff5b8a","#8a5cff"];
  const P=Array.from({length:160},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14*dpr,vy:(-Math.random()*16-6)*dpr,
    r:(5+Math.random()*6)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function step(t){ const el=t-t0; g.clearRect(0,0,W,H);
    for(const p of P){ p.vy+=.45*dpr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle=p.c; g.globalAlpha=Math.max(0,1-el/3200); g.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66); g.restore(); }
    if(el<3200) requestAnimationFrame(step); else { g.clearRect(0,0,W,H); cv.hidden=true; } })(t0);
}
function missedList(){return results.filter(r=>!r.ok).map(r=>r.c);}
$("go").onclick=()=>start();
$("again").onclick=()=>{$("end").hidden=true;$("start").hidden=false;updateNote();};
$("facit").onclick=showFacit;
$("practice").onclick=()=>start(missedList());
$("menu").onclick=()=>{ if(mode==="facit"){mode="done";$("end").hidden=false;return;} mode="idle";$("answers").hidden=true;$("flagbox").hidden=true;$("end").hidden=true;$("start").hidden=false;updateNote(); };
buildMap(CONT); apply();
</script>
